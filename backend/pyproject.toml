[project]
name = "coding-agent-monitor-backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "watchdog>=3.0.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
